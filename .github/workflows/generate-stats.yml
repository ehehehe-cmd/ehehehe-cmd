name: Generate GitHub Metrics

on:
  schedule:
    # Her gün UTC 00:00'da çalışır
    - cron: "0 0 * * *"
  workflow_dispatch: {} # Actions sekmesinden elle "Run workflow" ile tetiklenebilir
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          # Kartta gösterilecek genel bölümler: profil özeti, aktivite, repo listesi
          base: header, activity, community, repositories
          # Kullanılan diller grafiği
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
