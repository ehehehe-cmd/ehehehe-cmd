name: Generate GitHub Stats Images

on:
  schedule:
    # Her gün UTC 00:00'da çalışır (isteğe göre değiştirilebilir)
    - cron: "0 0 * * *"
  workflow_dispatch: {} # Elle tetiklemek istersen Actions sekmesinden "Run workflow" ile çalıştırabilirsin
  push:
    branches:
      - main

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub stats images
        uses: jstrieb/github-stats@master
        with:
          username: ehehehe-cmd
          exclude_repos: ""
          exclude_langs: ""
          include_all_commits: true
          # Bu action generated/ klasörüne overview.svg ve languages.svg üretir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/*
          git diff --quiet --cached || git commit -m "Update generated files"
          git push
