name: Generate GitHub Metrics

on:
  schedule:
    # Her gün UTC 00:00'da çalışır
    - cron: "0 0 * * *"
  workflow_dispatch: {} # Actions sekmesinden elle "Run workflow" ile tetiklenebilir
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Hesap genelindeki repoları ve dilleri görebilmesi için PAT gerekiyor,
          # GITHUB_TOKEN sadece bu repoyu görebiliyor.
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
